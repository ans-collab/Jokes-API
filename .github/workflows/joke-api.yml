# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Joke-API CI with Maven

permissions:
  contents: write
  packages: write
  security-events: write

on:
  push:
    branches: [ "main" ]
  pull_request_target:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: joke-api-jar
        path: target/*.jar

    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: joke-api-jar
        path: target/

    - name: Test EC2 SSH connectivity
      run: | 
        echo "Resolving EC2_HOST..." 
        getent hosts "${{ secrets.EC2_HOST }}"

        echo "Testing port 22.."
        nc -vz -w 10 "${{ secrets.EC2_HOST }}" 22
      
    - name: Copy JAR to Linux EC2 via SSH
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        source: "target/*.jar"
        target: "/home/${{ secrets.EC2_USERNAME }}/joke-api"
        strip_components: 1

    - name: Run JAR on Linux EC2 via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          # Install Java if not already installed
          if ! command -v java &> /dev/null; then
            echo "Installing Java..."
            sudo yum update -y
            sudo yum install -y java-26-amazon-corretto
          fi
          
          java -version
          
          cd /home/${{ secrets.EC2_USERNAME }}/app

          # 1.1. Find the actual JAR file name
          JAR_FILE=$(ls *.jar 2>/dev/null | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No JAR files found in $(pwd)"
            exit 1
          fi
     
          echo "Found JAR: $JAR_FILE"
          
          # Restart the systemd service
          echo "Restarting demo service..."
          sudo systemctl restart demo
          
      
          # 3. Give it 3 seconds to spin up and verify it didn't crash instantly
          sleep 3
          if pgrep -f "java-api-0.0.1-SNAPSHOT.jar" > /dev/null; then
            echo "Application successfully running in background."
          else
            echo "ERROR: Application failed to start. Check app.log for details."
            cat app.log
            exit 1
          fi
